<!DOCTYPE html>
<html>

<head>

<title>Signup - MyShop</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="auth-box">

<h2>Signup</h2>

<input type="text"
id="name"
placeholder="Enter Name">

<input type="email"
id="email"
placeholder="Enter Email">

<input type="password"
id="password"
placeholder="Enter Password">

<button onclick="signup()">

Signup

</button>

<p>
Already have account?
<a href="login.html">
Login
</a>
</p>

</div>

<script src="auth.js"></script>

</body>

</html>
